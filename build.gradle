plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// The mod is client-only. The client sources keep living in src/client so the
// history of the Fabric layout is preserved, but NeoForge builds a single jar
// from one source set.
sourceSets {
    main {
        java.srcDirs = ['src/main/java', 'src/client/java']
        resources.srcDirs = ['src/main/resources', 'src/client/resources', 'src/generated/resources']
    }
    test {
        java.srcDirs = ['src/test/java']
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenLocal()
}


def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

tasks.register('runTaskManagerTests', JavaExec) {
    group = 'verification'
    description = 'Runs TaskManager deterministic unit checks.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'wueffi.taskmanager.client.TaskManagerTestRunner'
    dependsOn tasks.named('testClasses')
}

tasks.named('test') {
    failOnNoDiscoveredTests = false
}

tasks.named('check') {
    dependsOn tasks.named('runTaskManagerTests')
}

jar {
    from('LICENSE.md') {
        rename { "${it}_${project.archives_base_name}" }
    }
    manifest {
        attributes(
                'Premain-Class': 'wueffi.taskmanager.MemoryAgent'
        )
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}
